<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b6c8ca">
<title>海岛战争 · 潮汐航线</title>
<style>
:root{color-scheme:light;--ink:#173638;--paper:#f6efdc;--sea:#b6c8ca;--teal:#24534e}
*{box-sizing:border-box}
body{margin:0;background:#9cbbbf;color:var(--ink);font:15px/1.45 system-ui,"Microsoft YaHei",sans-serif}
main{min-height:100dvh;display:grid;place-items:center}
h2,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #693f30;outline-offset:2px}
button:disabled{cursor:default}
.map{position:relative;isolation:isolate;width:min(100vw,100dvh,1024px);aspect-ratio:1;background:var(--sea);overflow:hidden;touch-action:none}
.map canvas,.islands{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.island{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:45px;height:44px;border:0;padding:0;background:none;pointer-events:auto;touch-action:none;user-select:none}
.number{display:block;background:var(--badge,#635944);color:#fff7e2;border:1px solid #fff0d2;border-radius:3px;min-width:25px;padding:1px 4px;box-shadow:0 2px 0 #243f4245;font:750 clamp(13px,2.3vw,20px)/1.2 system-ui;font-variant-numeric:tabular-nums}
.number[data-size=large]{min-width:29px;padding-inline:6px}
.island[aria-pressed=true] .number{outline:2px solid #1b4850;outline-offset:2px}
.island small{display:none;position:absolute;top:calc(50% + 14px);padding:1px 4px;background:#f8f2dfef;border-radius:2px;color:#233638;font:650 12px/1.25 system-ui;white-space:nowrap}
.island:is([aria-pressed=true],:focus-visible) small{display:block}
.island:is([aria-pressed=true],:focus-visible){z-index:1}
.hud{position:absolute;z-index:2;inset:10px 10px auto;display:flex;justify-content:flex-end;align-items:center;gap:10px;pointer-events:none}
.territory-bar{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;width:min(52%,300px);height:8px;padding:1px;background:#efe9d6;border:1px solid #65817e;border-radius:4px;overflow:hidden}
.territory-bar span{background:var(--side);min-width:0}
.menu{width:40px;height:38px;border:1px solid #678781;background:#eef0dc;color:#234e4d;border-radius:5px;font-size:20px;font-weight:700;pointer-events:auto}
.progress,.gesture-hint,.tip,.island-info{position:absolute;z-index:2;left:50%;transform:translateX(-50%);padding:4px 8px;border:1px solid #6b8b84;border-radius:4px;background:#f8f2e3ed;text-align:center;white-space:nowrap;pointer-events:none}
.progress{top:43px;padding:2px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.gesture-hint{bottom:46px;font-size:13px}
.tip{bottom:11px;font-size:12px}
.island-info{bottom:11px;max-width:calc(100% - 16px);white-space:normal;font-size:12px}
.panel{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(79%,290px);padding:16px;background:var(--paper);text-align:center;border:1px solid #325759;box-shadow:4px 5px 0 #3d606477;border-radius:5px}
.panel h2,.dock-head h2{font:700 23px/1.25 "Noto Serif SC",SimSun,serif}
.panel p{margin:5px 0 12px;color:#405b59;font-size:13px}
.actions{display:flex;justify-content:center;gap:7px;margin-top:9px}
.actions button,.dock-head button,.dock-grid button{min-height:39px;border:1px solid #798c7e;background:#f6efd9;border-radius:4px;padding:5px 10px}
.actions button.primary,.dock-grid button[aria-pressed=true]{background:var(--teal);color:#fff8dd;border-color:var(--teal)}
dialog{width:min(510px,calc(100% - 24px));max-height:calc(100dvh - 24px);border:1px solid #53726d;background:var(--paper);color:var(--ink);padding:16px;border-radius:6px}
dialog::backdrop{background:#183b407a}
.dock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dock-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.dock-grid button{display:grid;justify-items:start;text-align:left;gap:3px;min-width:0}
.dock-grid button:disabled{opacity:.66}
.dock-grid canvas{display:block;width:100%;height:auto;background:#b7c9c7;border:1px solid #64867f}
.dock-grid small{font:600 12px/1.4 system-ui}
.sr-only{position:absolute;width:1px;height:1px;padding:0;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
[hidden]{display:none!important}
@media (max-width:600px) and (orientation:portrait){
  .map{width:100%;height:100dvh}
  .island{width:40px;height:40px}
}
</style>
</head>
<body>
<main aria-label="海岛战争">
  <section class="map" id="board" aria-label="作战海图">
    <canvas id="map" width="1240" height="1240" aria-hidden="true"></canvas>
    <div class="islands" id="islands"></div>
    <div class="hud">
      <div id="territoryBar" class="territory-bar" aria-hidden="true"></div>
      <button id="openMenu" class="menu" type="button" aria-label="菜单">☰</button>
    </div>
    <p id="progress" class="progress" aria-label="战役进度"></p>
    <p id="tip" class="tip" hidden></p>
    <p id="islandInfo" class="island-info" hidden></p>
    <p id="gestureHint" class="gesture-hint" aria-hidden="true" hidden></p>
    <p id="status" class="sr-only" role="status"></p>
    <div id="end" class="panel" hidden>
      <h2 id="resultTitle" role="status"></h2><p id="resultBrief"></p>
      <div class="actions"><button id="again" type="button">再打一局</button><button id="next" class="primary" type="button">继续</button></div>
    </div>
  </section>
  <dialog id="menuDialog" aria-labelledby="menuTitle">
    <div class="dock-head"><h2 id="menuTitle">海岛战争</h2><form method="dialog"><button>返回</button></form></div>
    <div class="actions"><button id="restart" type="button">重开</button><button id="skill" type="button" hidden>顺风令</button><button id="openDock" type="button">舰队外观</button></div>
  </dialog>
  <dialog id="dock" aria-labelledby="dockTitle">
    <div class="dock-head"><h2 id="dockTitle">舰队外观</h2><form method="dialog"><button>返回</button></form></div>
    <p id="dockProgress"></p><div class="dock-grid" id="dockGrid"></div>
  </dialog>
</main>

function newBattle(i,random=Math.random){
  const level=levels[i];
  const nodes=level.nodes.map(([x,y,name,owner,units,kind,shape,fort=false,size='medium'])=>
    ({x,y,name,owner,units,kind,shape,fort,size,growth:0,pulseUntil:0}));
  const factionSet=new Set(nodes.map(node=>node.owner));
  const enemies=opponents.filter(plan=>factionSet.has(plan.owner)).map(plan=>({...plan,at:plan.first+(level.rivalDelay??0)}));
  let rivalTactics=null;
  if(random&&level.chapter!==undefined){
    varyStartingTroops(level,nodes,random);
    varyIslandPositions(level,nodes,random());
    if(enemies.length>1){
      const roll=random();
      const mode=roll<.30?'pincer':roll<.67?'rivalry':'mixed';
      rivalTactics={mode,firstRivalOrder:null,nextPincer:mode==='pincer'?18:mode==='mixed'?24:Infinity};
    }
  }
  return {mission:i,nodes,enemies,rivalTactics,
    fleets:[],effects:[],time:0,nextId:1,mode:'play',winner:0,windSpent:false,openingSent:false};
}

function limitStartPositions(nodes,battle){
  const {chapter,index,original}=battle;
  const training=original===1||original===2;
  const mustKeep=new Set([battle.neutralReserve,battle.opening?.source]);
  for(let owner=1;owner<=4;owner++){
    const owned=nodes.flatMap((node,id)=>node[3]===owner?[id]:[]).sort((a,b)=>nodes[b][4]-nodes[a][4]);
    if(!owned.length)continue;
    mustKeep.add(owned[0]);
    if(owner===1&&owned.length>1&&(training||chapter>=1||index===7)){
      mustKeep.add(owned.find(id=>nodes[id][5]!==nodes[owned[0]][5])??owned[1]);
    }
    if(owner>1){
      const count=opponentPortCount(battle,owned.length);
      for(const id of owned.slice(1,count))mustKeep.add(id);
    }
  }
  return nodes.map((node,id)=>{
    if(node[3]===0||mustKeep.has(id))return node;
    const neutral=node.slice();
    neutral[3]=0;
    neutral[4]=Math.max(7,Math.floor(node[4]*.52));
    return neutral;
  });
}

function opponentPortCount(level,authored){
  if(level.chapter===0)return level.index===6?2:1;
  if(level.chapter===1)return level.index>=6?Math.min(2,authored):1;
  if(level.chapter===2)return level.index%3===1?2:1;
  if(level.chapter===3)return level.index===2?3:2;
  return 2;
}

function balanceOpening(level,nodes){
  const own=nodes.filter(node=>node[3]===1);
  const sides=[...new Set(nodes.filter(node=>node[3]>1).map(node=>node[3]))];
  const neutralReserve=level.neutralReserve;
  const playerBudget=[[20,30,28,23,26,26,28,30],[30,30,32,32,32,34,34,34],
    [34,36,36,38,38,38,40,40],[38,40,40,42,42,42,44,44],[42,42,44,44,44,46,46,46]][level.chapter][level.index];
  const home=own.reduce((main,node)=>node[4]>main[4]?node:main);
  if(own.length===1)home[4]=playerBudget;
  else {
    home[4]=Math.ceil(playerBudget*.59);
    own.find(node=>node!==home)[4]=playerBudget-home[4];
    if(level.chapter>=2){
      home[8]='large';
      own.find(node=>node!==home)[8]='small';
    }
  }

  const distance=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const nearestNeutral=nodes
    .filter((node,id)=>node[3]===0&&id!==neutralReserve)
    .reduce((nearest,node)=>distance(home,node)<distance(home,nearest)?node:nearest);
  nearestNeutral[4]=Math.min(nearestNeutral[4],Math.max(3,Math.floor(home[4]/2)-2));
  const openingSalvo=own.reduce((sum,node)=>sum+Math.floor(node[4]/2),0);
  const singleRatio=[1,1.05,1.10,1.16,1.19][level.chapter];
  const rivalRatio=sides.length===1?singleRatio:(sides.length===2?.70:.66)+level.chapter*.026;

  for(const side of sides){
    const ports=nodes.filter(node=>node[3]===side);
    const capital=ports.reduce((main,node)=>node[4]>main[4]?node:main);
    const need=opponentPortCount(level,ports.length);
    const candidates=nodes.filter((node,id)=>node[3]===0&&node!==nearestNeutral&&id!==neutralReserve)
      .sort((a,b)=>distance(capital,a)-distance(capital,b));
    for(const outpost of candidates.slice(0,Math.max(0,need-ports.length))){
      outpost[3]=side;
      ports.push(outpost);
    }
    const budget=Math.round(playerBudget*rivalRatio);
    capital[4]=Math.max(openingSalvo+1,Math.round(budget*(ports.length===1?1:.71)));
    const outposts=ports.filter(node=>node!==capital);
    if(outposts.length){
      const reserves=Math.max(outposts.length*5,budget-capital[4]);
      const share=Math.floor(reserves/outposts.length);
      outposts.forEach((node,index)=>{node[4]=share+(index<reserves%outposts.length?1:0);});
    }
  }
  if(neutralReserve!==undefined&&nodes[neutralReserve][3]===0){
    nodes[neutralReserve][4]=Math.max(openingSalvo,Math.min(nodes[neutralReserve][4],openingSalvo+5));
  }
}

function varyStartingTroops(level,nodes,random){
  const groups=[1,2,3,4].map(side=>nodes.filter(node=>node.owner===side).sort((a,b)=>b.units-a.units));
  const [player,...enemies]=groups.filter(ports=>ports.length);
  const total=ports=>ports.reduce((sum,node)=>sum+node.units,0);
  const integer=(low,high)=>low+Math.floor(random()*(high-low+1));
  const spread=level.chapter<2?2:3;
  const playerBudget=total(player)+integer(-spread,spread);
  distributeStartingTroops(player,playerBudget);
  const firstWave=player.reduce((sum,node)=>sum+Math.floor(node.units/2),0);

  if(enemies.length===1){
    const [enemy]=enemies;
    const localSize={small:0,medium:1,large:2};
    const sizeDifference=localSize[enemy[0].size]-localSize[player[0].size];
    const roll=random();
    const favorEnemy=.72+sizeDifference*.035;
    const lead=integer(1,level.chapter<2?3:5);
    const budget=playerBudget+(roll<favorEnemy?lead:roll<favorEnemy+.17?0:-lead);
    distributeStartingTroops(enemy,budget,firstWave+1);
  }else{
    const perFactionLimit=Math.floor(playerBudget*2.5/enemies.length);
    for(const enemy of enemies){
      const budget=Math.min(perFactionLimit,total(enemy)+integer(-spread,spread));
      distributeStartingTroops(enemy,budget,firstWave+1);
    }
  }
}

function distributeStartingTroops(ports,budget,minimum=0){
  const [capital,...outposts]=ports;
  const guard=4;
  budget=Math.max(budget,minimum+outposts.length*guard);
  if(!outposts.length){capital.units=budget;return;}
  const base=ports.reduce((sum,node)=>sum+node.units,0);
  capital.units=Math.max(minimum,Math.min(budget-outposts.length*guard,Math.round(budget*capital.units/base)));
  const reserves=budget-capital.units;
  const share=Math.floor(reserves/outposts.length);
  outposts.forEach((node,i)=>{node.units=share+(i<reserves%outposts.length?1:0);});
}

function varyIslandPositions(level,nodes,seed){
  let state=(Math.floor(seed*4294967296)>>>0)||0x6d2b79f5;
  const random=()=>{
    state^=state<<13;state^=state>>>17;state^=state<<5;
    return (state>>>0)/4294967296;
  };
  const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const home=nodes.find(node=>node.owner===1);
  const nearby=nodes.filter(node=>node.owner===0).sort((a,b)=>distance(home,a)-distance(home,b))[0];
  const originalDistance=distance(home,nearby);
  const minSpacing=73;
  const mirror=level.chapter>0&&random()<.45;
  for(const node of nodes){
    const radius=node.owner===0&&node!==nearby?(level.chapter===0?24:39):level.chapter===0?8:16;
    for(let attempt=0;attempt<6;attempt++){
      const angle=random()*Math.PI*2, offset=radius*(.4+.6*random());
      const candidate={x:Math.round(node.x+Math.cos(angle)*offset),y:Math.round(node.y+Math.sin(angle)*offset)};
      if(candidate.x<60||candidate.x>WIDTH-60||candidate.y<59||candidate.y>HEIGHT-57)continue;
      if(nodes.some(other=>other!==node&&distance(candidate,other)<minSpacing))continue;
      if(node===home&&distance(candidate,nearby)>originalDistance+17)continue;
      if(node===nearby&&distance(candidate,home)>originalDistance+17)continue;
      node.x=candidate.x;node.y=candidate.y;
      break;
    }
  }
  if(mirror)for(const node of nodes)node.x=WIDTH-node.x;
}

function chartBattle(battle){
  const {chapter,index,original}=battle;
  const desired=islandCounts[chapter][index];
  const seed=chapter*19+index*7;
  const nodes=limitStartPositions(battle.nodes,battle).map((node,id)=>{
    const [x,y,name,owner,units,kind,shape,fort=false,size]=node;
    const tier=size??(fort?'large':owner===0?(units>=15?'large':id%3===0?'medium':'small'):'medium');
    const north=original===0?y:Math.round(y*1.06)+18;
    return [x,north,name,owner,units,kind,shape,fort,tier];
  });
  const points=soundingRows.flat().map(([x,y],id)=>[
    x+((id*29+seed*13)%19)-9,
    y+((id*17+seed*11)%23)-11,
  ]);
  const ordered=points.map((point,id)=>points[(id*17+seed)%points.length]);
  while(nodes.length<desired&&ordered.length){
    const distances=ordered.map(([x,y])=>Math.min(...nodes.map(node=>Math.hypot(node[0]-x,node[1]-y))));
    const gap=desired<13?81:74;
    const preferred=distances.findIndex(d=>d>=gap);
    const chosen=preferred<0?distances.indexOf(Math.max(...distances)):preferred;
    const [x,y]=ordered.splice(chosen,1)[0];
    const id=nodes.length,variant=(seed+id*13)%8;
    const size=variant<=3?'small':variant<=5?'medium':'large';
    const kind=chapter>=2&&variant===5?'air':'sea';
    const name=shoalNames[(id+seed)%shoalNames.length]+(kind==='air'?'机场':'');
    const baseGuard=size==='large'?(chapter>=2&&variant===7?21:12):size==='medium'?8:5;
    const units=baseGuard+(seed+id)%4;
    nodes.push([x,y,name,0,units,kind,(id+seed)%4,false,size]);
  }
  balanceOpening(battle,nodes);
  return {...battle,nodes,pace:sailingPace[chapter]};
}

function expandBattle(battle,chapter,index){
  const {rows,tip,delay}=battle;
  if(!rows)return chartBattle({...battle,chapter,index,original:originalBattles.indexOf(battle)});
  const sides={p:1,r:2,b:3,gold:4,n:0};
  const names=harborNames[chapter];
  const nodes=[];
  let neutralReserve;
  rows.forEach((row,y)=>row.split(' ').forEach((cell,x)=>{
    if(cell==='.')return;
    const [,mark,side,count,kind]=/^(@?)(p|r|b|gold|n)(\d+)(a|f)?$/.exec(cell);
    const id=nodes.length;
    if(mark&&side==='n')neutralReserve=id;
    const name=names[(id+index)%names.length]+(kind==='a'?'机场':'');
    const stagger=y%2===0?-7:7;
    nodes.push([94+x*108+stagger+((index+3*x+chapter*7)%19)-9,
      100+y*107+((x*11+index*5+chapter*3)%31)-15,name,sides[side],Number(count),kind==='a'?'air':'sea',(x+y+chapter)%4,kind==='f']);
  }));
  return chartBattle({name:battle.name,guide:tip,rivalDelay:delay,skill:chapter>0,nodes,chapter,index,neutralReserve});
}

const levels=chapters.flatMap((chapter,id)=>chapter.battles.map((battle,index)=>expandBattle(battle,id,index)));
const stageId=level=>`${level.chapter+1}-${level.index+1}`;


function dispatchable(s,sourceIds,targetId,owner){
  return [...new Set(sourceIds)].filter(id=>id!==targetId&&s.nodes[id]?.owner===owner&&s.nodes[id].units>=2);
}
function arrivalStrength(node,kind,units){return node.fort&&kind==='air'?Math.floor(units*.6):units;}
function canUseWind(s,node,owner,boost){
  return Boolean(node.kind==='sea'&&boost&&owner===1&&!s.windSpent&&levels[s.mission].skill);
}
function travelTime(level,from,to,wind=false){
  const campaign=level.pace!==undefined;
  const speed=(from.kind==='air'?(campaign?208:192):(campaign?116:124))*(level.pace??1);
  const minimum=campaign?.85:1.25;
  return Math.max(minimum,Math.hypot(from.x-to.x,from.y-to.y)/speed)/(wind?1.35:1);
}
const productionSize={small:1.13,medium:1,large:.88};
const islandCapacity={small:30,medium:50,large:80};
function productionCap(node){return islandCapacity[node.size]??islandCapacity.medium;}
function productionPeriod(node,owner=node.owner){
  const base=node.kind==='air'?1.6:owner===1?1.05:1.24;
  return base*(productionSize[node.size]??1);
}
function sendBatch(s,sourceIds,targetId,owner,boost=false){
  if(s.mode!=='play'||!s.nodes[targetId])return {sent:0,units:0};
  const target=s.nodes[targetId];
  let sent=0,units=0,boosted=false;
  for(const id of dispatchable(s,sourceIds,targetId,owner)){
    const node=s.nodes[id],amount=Math.floor(node.units/2);
    const wind=canUseWind(s,node,owner,boost);
    const duration=travelTime(levels[s.mission],node,target,wind);
    s.fleets.push({id:s.nextId++,owner,kind:node.kind,units:amount,x:node.x,y:node.y,target:targetId,
      vx:(target.x-node.x)/duration,vy:(target.y-node.y)/duration,remaining:duration,boosted:wind,elapsed:0});
    node.units-=amount;sent++;units+=amount;boosted ||= wind;
  }
  if(boosted)s.windSpent=true;
  return {sent,units,boosted};
}
function firstContact(a,b,span){
  if(a.owner===b.owner||a.kind!==b.kind)return null;
  const x=a.x-b.x,y=a.y-b.y,vx=a.vx-b.vx,vy=a.vy-b.vy;
  const offset=x*x+y*y-CONTACT*CONTACT;
  if(offset<=0)return 0;
  const speed=vx*vx+vy*vy,slope=x*vx+y*vy;
  if(speed<EPS||slope>=0)return null;
  const discriminant=slope*slope-speed*offset;
  if(discriminant<0)return null;
  const t=(-slope-Math.sqrt(discriminant))/speed;
  return t>=0&&t<=span?t:null;
}
function arrive(s,f,at){
  const n=s.nodes[f.target];
  if(n.owner===f.owner){n.units+=f.units;return;}
  const impact=arrivalStrength(n,f.kind,f.units);
  if(impact!==f.units)s.effects.push({x:n.x,y:n.y,at,label:'岸防 −'+(f.units-impact),kind:'fort'});
  if(impact>n.units){
    n.units=impact-n.units;n.owner=f.owner;n.growth=0;n.pulseUntil=at+.65;
  }
  else n.units-=impact;
}
function moveFleets(s,dt){
  const events=[];
  for(let i=0;i<s.fleets.length;i++){
    const a=s.fleets[i];
    if(a.remaining<=dt)events.push({t:a.remaining,a});
    for(let j=i+1;j<s.fleets.length;j++){
      const b=s.fleets[j],t=firstContact(a,b,Math.min(dt,a.remaining,b.remaining));
      if(t!==null)events.push({t,a,b});
    }
  }
  events.sort((p,q)=>p.t-q.t||Number(Boolean(q.b))-Number(Boolean(p.b))||p.a.id-q.a.id||(p.b?.id??0)-(q.b?.id??0));
  for(const {t,a,b} of events){
    if(a.units===0||a.arrived)continue;
    if(!b){arrive(s,a,s.time+t);a.arrived=true;continue;}
    if(b.units===0||b.arrived)continue;
    const clash=Math.min(a.units,b.units);
    a.units-=clash;b.units-=clash;
    s.effects.push({x:(a.x+b.x+(a.vx+b.vx)*t)/2,y:(a.y+b.y+(a.vy+b.vy)*t)/2,at:s.time+t,label:`−${clash} / −${clash}`,kind:a.kind});
  }
  s.fleets=s.fleets.filter(f=>f.units>0&&!f.arrived);
  for(const f of s.fleets){f.x+=f.vx*dt;f.y+=f.vy*dt;f.remaining-=dt;f.elapsed+=dt;}
}
function chooseEnemyMove(s,plan){
  const side=plan.owner;
  const reserves=s.nodes.flatMap((n,id)=>n.owner===side&&n.units>=12?[{id,node:n,units:Math.floor(n.units/2)}]:[]);
  const tactics=s.rivalTactics;
  const rivalry=tactics&&tactics.mode!=='pincer'&&s.time<52;
  let best=null;
  s.nodes.forEach((to,target)=>{
    if(to.owner===side)return;
    const friendly=s.fleets.reduce((sum,f)=>sum+(f.target===target&&f.owner===side?arrivalStrength(to,f.kind,f.units):0),0);
    if(friendly>to.units+4)return;
    const contested=s.fleets.some(f=>f.target===target&&f.owner!==side);
    const baseScore=(to.owner===0?plan.neutralBias:plan.raidBias)+(to.kind==='air'?3:0)-(contested?2:0);
    const candidates=reserves.map(({id,node,units})=>({id,units:arrivalStrength(to,node.kind,units),distance:Math.hypot(node.x-to.x,node.y-to.y)}));
    const remember=(ids,strength,distance,penalty)=>{
      const advantage=strength+friendly-to.units;
      const rivalBonus=rivalry&&to.owner>1&&advantage>0?8:0;
      const score=baseScore+Math.min(15,advantage)-distance/60-penalty+rivalBonus;
      if(score>0&&(!best||score>best.score))best={ids,target,score};
    };
    candidates.forEach(from=>remember([from.id],from.units,from.distance,0));
    if(to.owner===0||friendly>0||s.mission<3)return;
    const nearby=candidates.filter(from=>from.distance<=305).sort((a,b)=>(b.units-b.distance/25)-(a.units-a.distance/25)).slice(0,2);
    if(nearby.length===2){
      const [a,b]=nearby;
      if(Math.max(a.units,b.units)<=to.units&&a.units+b.units>to.units)remember([a.id,b.id],a.units+b.units,Math.max(a.distance,b.distance),8);
    }
  });
  if(best){
    const targetSide=s.nodes[best.target].owner;
    const result=sendBatch(s,best.ids,best.target,side);
    if(result.sent&&targetSide>1&&tactics&&tactics.firstRivalOrder===null)tactics.firstRivalOrder=s.time;
  }
}

function tryPincer(s,activeOpponents){
  const tactics=s.rivalTactics;
  if(!tactics||s.time<tactics.nextPincer||activeOpponents.length<2)return;
  if(tactics.mode==='mixed'&&(tactics.firstRivalOrder===null||s.time-tactics.firstRivalOrder<7))return;
  tactics.nextPincer=s.time+1;
  const level=levels[s.mission];
  const player=s.nodes.flatMap((node,id)=>node.owner===1?[{node,id}]:[]);
  const ready=activeOpponents.filter(plan=>plan.at<=s.time+plan.interval*.82);
  const orders=ready.flatMap(plan=>s.nodes.flatMap((from,source)=>{
    if(from.owner!==plan.owner||from.units<14)return [];
    const units=Math.floor(from.units/2);
    return player.flatMap(({node:to,id:target})=>{
      const impact=arrivalStrength(to,from.kind,units);
      const eta=travelTime(level,from,to);
      if(eta>5.8||impact<Math.max(7,to.units*.4))return [];
      return [{plan,source,target,impact,eta}];
    });
  }));
  let best=null;
  for(let i=0;i<orders.length;i++){
    const a=orders[i],target=s.nodes[a.target];
    for(let j=i+1;j<orders.length;j++){
      const b=orders[j];
      if(a.plan===b.plan||Math.abs(a.eta-b.eta)>2.5)continue;
      const sameTarget=a.target===b.target;
      if(sameTarget&&(a.impact+b.impact<=target.units||!oppositeApproach(s.nodes[a.source],s.nodes[b.source],target)))continue;
      const score=a.impact+b.impact-(a.eta+b.eta)*2+(sameTarget?0:6);
      if(!best||score>best.score)best={a,b,score};
    }
  }
  if(!best)return;
  const firstFleet=s.nextId;
  for(const order of [best.a,best.b]){
    sendBatch(s,[order.source],order.target,order.plan.owner);
    order.plan.at=s.time+order.plan.interval;
  }
  for(const fleet of s.fleets)if(fleet.id>=firstFleet)fleet.pincer=true;
  tactics.nextPincer=Infinity;
}

function oppositeApproach(a,b,to){
  const ax=a.x-to.x,ay=a.y-to.y,bx=b.x-to.x,by=b.y-to.y;

    n.growth+=dt;
    const period=productionPeriod(n);
    if(n.growth>=period){n.units++;n.growth-=period;}
  }
  moveFleets(s,dt);s.time+=dt;
  s.effects=s.effects.filter(e=>s.time-e.at<1.1);
  const alive=new Set([...s.nodes.map(n=>n.owner),...s.fleets.map(f=>f.owner)]);
  const activeOpponents=s.enemies.filter(plan=>alive.has(plan.owner));
  const conquered=!s.nodes.some(node=>node.owner>1);
  if(!alive.has(1)||conquered){
    s.winner=Number(alive.has(1)&&conquered);
    s.mode='end';

  }
  if(level.opening&&!s.openingSent&&s.time>=level.opening.at){
    const {side,source,target}=level.opening;sendBatch(s,[source],target,side);s.openingSent=true;
  }

  for(const plan of activeOpponents)if(s.time>=plan.at){chooseEnemyMove(s,plan);plan.at=s.time+plan.interval;}
}

    c.fillStyle=n%3?'#31585815':'#f8f3d63b';c.fillRect(x,y,n%11===0?2:1,n%11===0?1.2:.7);
  }
  for(let x=26;x<WIDTH;x+=45)trace(c,x,10,x,HEIGHT-10,'#3a646b2e',.6);
  for(let y=26;y<HEIGHT;y+=45)trace(c,10,y,WIDTH-10,y,'#3a646b2e',.6);
  c.strokeStyle='#4f6d72a3';c.lineWidth=1;c.strokeRect(11,11,WIDTH-22,HEIGHT-22);
  c.font='10px Georgia';c.fillStyle='#365d61';c.textAlign='center';
  const offsets=[48,130,214,296,378,460,542];
  offsets.forEach((x,i)=>{c.fillText(`${114+i}°`,x,24);trace(c,x,11,x,16,'#4d7074');});
  const depths=[[75,298,12],[303,83,27],[169,278,18],[409,324,36],[552,72,43],[34,159,21],[353,454,16],[570,450,18],[263,351,25],[425,66,33]];
  c.fillStyle='#4e757b';for(const [x,y,n] of depths){if(state.nodes.every(a=>Math.hypot(a.x-x,a.y-y)>53))c.fillText(n,x,y);}
  c.save();c.translate(47,HEIGHT-41);c.scale(1,state.viewAspect??1);c.lineWidth=.8;ellipse(c,0,0,20,20,null,'#3d676a');
  for(let i=0;i<8;i++){c.save();c.rotate(Math.PI*i/4);trace(c,0,-19,0,-24,'#3d676a');c.restore();}
  fillPath(c,[[0,-20],[6,6],[0,2],[-6,6]],'#254b51','#254b51');
  fillPath(c,[[0,18],[5,-5],[0,1],[-5,-5]],'#e8e2c5','#254b51');c.fillStyle='#254b51';c.fillText('N',0,-27);c.restore();
  c.fillStyle='#345c60';c.font='10px SimSun, serif';c.textAlign='right';c.fillText('水深标记 · 米',601,HEIGHT-24);
  state.nodes.forEach(n=>paintIsland(c,n));
}
function ship(c,side,front,skin='patrol'){
  const color=palette[side];
  trace(c,-8,-2.4,-24,-4.4,wakes[side],1.75);trace(c,-8,2.4,-24,4.4,wakes[side],1.75);
  c.lineWidth=1.15;
  if(skin==='sail'){
    fillPath(c,[[-10,-2],[-2,-4],[7,-2],[12,0],[6,3],[-7,3]],color,'#203d42');
    fillPath(c,[[-5,5],[-1,-8],[5,5]],'#fff1d4','#574c38');
    trace(c,-1,-8,-1,6,'#674e35',.75);
    return;
  }
  if(skin==='copper'){
    fillPath(c,[[-12,-3],[-9,-6],[3,-5],[12,0],[3,5],[-9,6],[-12,3]],color,'#203d42');
    trace(c,-9,-3,5,-2,'#e7b475',1.25);trace(c,-9,3,5,2,'#e7b475',1.25);
    ellipse(c,-4,0,2.6,2.2,'#eddabd','#584532');
    ellipse(c,3,0,2,1.8,'#eddabd','#584532');
    return;
  }
  if(skin==='lantern'){
    fillPath(c,[[-12,-3],[-4,-5],[5,-5],[11,-2],[11,2],[5,5],[-4,5],[-12,3]],color,'#203d42');
    c.fillStyle='#e4c87d';c.fillRect(-5,-3,6,6);
    ellipse(c,-2,0,1.7,1.7,'#fff5b6');
    trace(c,5,-2,8,-2,'#faf1ca',1.4);trace(c,5,2,8,2,'#faf1ca',1.4);
    return;
  }
  fillPath(c,[[-10,-4],[2,-4],[10,0],[2,4],[-10,4]],color,'#203d42');
  c.fillStyle='#f3e6c8';c.fillRect(-5,-2.5,4.3,5);
  if(front)trace(c,1,0,5,0,'#efe2bb',1.2);
}
function airplane(c,side){
  trace(c,-10,-1.4,-25,-1.4,'#f4ede2',1.2);
  c.lineWidth=1.1;fillPath(c,[[-12,0],[-8,-3],[-4,-2],[-6,-8],[-2,-8],[2,-2],[8,-2],[11,0],[8,2],[2,2],[-2,8],[-6,8],[-4,2],[-8,3]],palette[side],'#263e49');
  trace(c,-6,0,7,0,'#fff1cd',1);
}
function aimLine(c,from,to){
  const dx=to.x-from.x,dy=to.y-from.y,length=Math.hypot(dx,dy);
  if(length<6)return;
  const angle=Math.atan2(dy,dx),end=Math.max(3,length-26);
  c.save();c.translate(from.x,from.y);c.rotate(angle);
  c.beginPath();c.moveTo(21,0);c.lineTo(end,0);c.stroke();
  c.setLineDash([]);c.beginPath();c.moveTo(end-7,-4);c.lineTo(end,0);c.lineTo(end-7,4);c.stroke();c.restore();
}
function draw(){
  const c=ctx;c.drawImage(base,0,0,WIDTH,HEIGHT);
  const aspect=state.viewAspect??1;
  state.nodes.forEach((n,id)=>{
    const active=selected.has(id)||gesture?.sources?.has(id)&&n.owner===1;
    const scale=islandScale(n);
    c.save();c.translate(n.x,n.y);c.scale(scale,scale*aspect);c.lineWidth=active?2.4:1.15;
    if(active)coast(c,shapes[n.shape],1.38,0,1,null,'#184e54');
    c.setLineDash([]);
    if(n.owner!==0){
      c.globalAlpha=.22;
      coast(c,shapes[n.shape],.97,0,0,palette[n.owner]);
      c.globalAlpha=1;
    }
    c.lineWidth=1.1;coast(c,shapes[n.shape],1.13,0,0,null,palette[n.owner]);
    if(n.pulseUntil>state.time){c.globalAlpha=(n.pulseUntil-state.time)/.65;c.lineWidth=2;ellipse(c,0,0,69-(n.pulseUntil-state.time)*36,50-(n.pulseUntil-state.time)*26,null,palette[n.owner]);c.globalAlpha=1;}
    c.restore();
  });
  for(const fleet of state.fleets){
    if(!fleet.pincer)continue;
    const target=state.nodes[fleet.target];
    c.save();
    c.globalAlpha=.36;
    c.setLineDash([4,5]);
    trace(c,fleet.x,fleet.y,target.x,target.y,palette[fleet.owner],1.45);
    c.restore();
  }
  for(const f of state.fleets){
    const angle=Math.atan2(f.vy/aspect,f.vx);
    for(let i=Math.min(3,Math.floor(f.units/6));i>=0;i--){
      c.save();c.translate(f.x,f.y);c.scale(1,aspect);c.rotate(angle);c.translate(-Math.min(f.elapsed*57,i*10),(i%2?1:-1)*i*4);
      c.scale(i===0?1:.68,i===0?1:.68);
      if(f.kind==='air')airplane(c,f.owner);else ship(c,f.owner,i===0,f.owner===1?state.skin:undefined);
      c.restore();
    }
    c.save();c.translate(f.x,f.y);c.scale(1,aspect);
    c.font='700 14px system-ui';c.textAlign='center';c.lineWidth=3;c.strokeStyle='#faf1da';c.strokeText(f.units,0,-12);
    c.fillStyle=f.boosted?'#775426':palette[f.owner];c.fillText(f.units,0,-12);c.restore();
  }
  for(const effect of state.effects){
    const age=Math.max(0,state.time-effect.at);
    c.save();c.translate(effect.x,effect.y);c.scale(1,aspect);c.globalAlpha=1-age/1.1;
    c.lineWidth=1.4;ellipse(c,0,0,8+age*23,8+age*23,null,'#8b4b37');
    c.font='bold 15px system-ui';c.textAlign='center';c.fillStyle='#653c31';c.fillText(effect.label,0,-15-age*12);c.restore();
  }
  if(gesture?.drag){
    const {from,to,id}=gesture;c.strokeStyle='#183e44';c.lineWidth=2;c.setLineDash([5,4]);
    if(id===null){c.fillStyle='#f8f1d56b';c.fillRect(from.x,from.y,to.x-from.x,to.y-from.y);c.strokeRect(from.x,from.y,to.x-from.x,to.y-from.y);}
    else {
      const target=hitAt(to),aims=dispatchable(state,gesture.sources,target,1);
      if(target!==null&&aims.length){
        const node=state.nodes[target];aims.forEach(source=>aimLine(c,state.nodes[source],node));
        const scale=islandScale(node);
        c.save();c.translate(node.x,node.y);c.scale(scale,scale*aspect);c.setLineDash([]);c.lineWidth=2.2;coast(c,shapes[node.shape],1.45,0,0,null,'#1c5057');c.restore();
      }else{
        c.beginPath();[...gesture.sources].forEach((source,i)=>{const n=state.nodes[source];if(i)c.lineTo(n.x,n.y);else c.moveTo(n.x,n.y);});
        c.lineTo(to.x,to.y);c.stroke();
      }
    }
    c.setLineDash([]);
  }
}


setMode(unlocked());requestAnimationFrame(frame);
</script>
